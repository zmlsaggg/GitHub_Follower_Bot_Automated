name: GitHub Active Developer Discovery

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: "GitHub repository search query"
        required: true
        default: "stars:>100 pushed:>2026-10-20"
        type: string
      max_repositories:
        description: "Trending repositories to inspect (1-30)"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "20"
          - "30"
      max_stargazers:
        description: "Stargazers to inspect per repository (1-100)"
        required: true
        default: "100"
        type: choice
        options:
          - "25"
          - "50"
          - "100"

permissions:
  contents: read

concurrency:
  group: github-active-developer-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Discover active developers
        env:
          GITHUB_USER: zmlsaggg
          PERSONAL_GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          MAX_REPOSITORIES: ${{ inputs.max_repositories }}
          MAX_STARGAZERS_PER_REPO: ${{ inputs.max_stargazers }}
        run: python bot.py

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: github-active-developer-discovery
          path: discovery/
          if-no-files-found: error
          retention-days: 14
