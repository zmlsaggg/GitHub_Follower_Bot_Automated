name: GitHub Follower Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not follow anyone"
        required: true
        type: boolean
        default: true
      max_follows:
        description: "Maximum new follows in this run (1-10)"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
        default: "3"

permissions:
  contents: write

concurrency:
  group: follower-bot
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run follower bot
        env:
          GITHUB_USER: zmlsaggg
          PERSONAL_GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_FOLLOWS: ${{ inputs.max_follows }}
        run: python bot.py

      - name: Persist progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.txt follower_counter.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: save follower bot progress"
            git push origin HEAD:main
          else
            echo "No progress files changed."
          fi
